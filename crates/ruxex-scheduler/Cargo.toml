[package]
name = "ruxex-scheduler"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
ruxex-app-server-client = { version = "0.4.4", git = "https://github.com/Ruxex/ruxex.git", tag = "v0.4.4" }
ruxex-app-server-protocol = { version = "0.4.4", git = "https://github.com/Ruxex/ruxex.git", tag = "v0.4.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

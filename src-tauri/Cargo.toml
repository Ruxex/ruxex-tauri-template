[package]
name = "ruxex-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[features]
default = ["example"]
example = ["dep:ruxex-provider-host-example"]

[lib]
name = "ruxex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ruxex-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
ruxex-scheduler = { path = "../crates/ruxex-scheduler" }
# The desktop bridge consumes the public 0.5.0 desktop facade for App Server and host APIs.
ruxex = { version = "0.5.0", git = "https://github.com/Ruxex/ruxex.git", tag = "v0.5.0", default-features = false, features = ["desktop"] }
ruxex-provider-host-example = { version = "0.5.0", git = "https://github.com/Ruxex/ruxex.git", tag = "v0.5.0", features = ["dummy-provider"], optional = true }
dirs = "6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri = { version = "2.8.0", features = [] }
# Keep the proc-macro API aligned with the selected Tauri release.
tauri-macros = "=2.5.5"
# Keep the runtime trait version aligned with tauri-runtime-wry, whose
# dependency is pinned by the selected Tauri release.
tauri-runtime = "=2.10.1"
tauri-plugin-deep-link = "2.4.0"
tauri-plugin-dialog = "2.2.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.0"
tokio = { version = "1", features = ["macros", "sync", "time"] }

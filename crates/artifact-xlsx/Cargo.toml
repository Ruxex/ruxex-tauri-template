[package]
name = "ruxex-artifact-xlsx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "ruxex_artifact_xlsx"
path = "src/lib.rs"

[dependencies]
ruxex-artifact-common = { path = "../artifact-common" }
base64 = "0.22"
calamine = "0.31"
rust_xlsxwriter = "0.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "7.4.0", default-features = false, features = ["deflate"] }

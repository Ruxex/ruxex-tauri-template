[package]
name = "ruxex-scheduler"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

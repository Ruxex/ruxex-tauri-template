[package]
name = "ruxex-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[features]
default = ["example"]
example = ["dep:ruxex-provider-host-example"]
e2e = ["dep:tauri-plugin-wdio"]

[lib]
name = "ruxex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ruxex-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
anyhow = "1"
base64 = "0.22"
ruxex-scheduler = { path = "../crates/ruxex-scheduler" }
# Pin runtime and example-provider dependencies to the published Ruxex release.
ruxex = { git = "https://github.com/Ruxex/ruxex.git", tag = "v0.6.1", version = "0.6.1", default-features = false, features = ["desktop"] }
ruxex-provider-host-example = { git = "https://github.com/Ruxex/ruxex.git", tag = "v0.6.1", package = "ruxex-provider-host-example", version = "0.6.1", features = ["dummy-provider", "cloudflare-provider"], optional = true }
dirs = "6"
futures = "0.3"
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "3e636cab26c013eca5131103c03d20237f12c4df", version = "=3.3.0", default-features = false, features = [
    "macros",
    "server",
    "transport-async-rw",
    "transport-streamable-http-server",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri = { version = "2.8.0", features = [] }
# Keep the proc-macro API aligned with the selected Tauri release.
tauri-macros = "=2.5.5"
# Keep the runtime trait version aligned with tauri-runtime-wry, whose
# dependency is pinned by the selected Tauri release.
tauri-runtime = "=2.10.1"
tauri-plugin-deep-link = "2.4.0"
tauri-plugin-dialog = "2.2.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.0"
tokio = { version = "1", features = [
    "io-std",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tauri-plugin-wdio = { version = "1", optional = true }

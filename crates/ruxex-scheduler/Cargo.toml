[package]
name = "ruxex-scheduler"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
ruxex = { git = "https://github.com/Ruxex/ruxex.git", tag = "v0.6.1", version = "0.6.1", default-features = false, features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

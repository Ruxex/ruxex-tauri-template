[package]
name = "ruxex-artifact-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "ruxex_artifact_engine"
path = "src/lib.rs"

[[bin]]
name = "ruxex-artifacts-engine"
path = "src/bin/ruxex-artifacts-engine.rs"

[dependencies]
ruxex-artifact-common = { path = "../artifact-common" }
ruxex-artifact-docx = { path = "../artifact-docx" }
ruxex-artifact-pptx = { path = "../artifact-pptx" }
ruxex-artifact-xlsx = { path = "../artifact-xlsx" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.47.0"
pdf-writer = "0.15.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "7.4.0", default-features = false, features = ["deflate"] }

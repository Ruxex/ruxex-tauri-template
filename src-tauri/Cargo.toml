[package]
name = "ruxex-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
name = "ruxex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ruxex-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
base64 = "0.22"
ruxex-app-server-client = { version = "0.1.0", git = "https://github.com/Ruxex/ruxex.git", rev = "851c24d5733c1fb3179d067a087a84d2a6a7c3e4" }
ruxex-app-server-daemon = { version = "0.1.0", git = "https://github.com/Ruxex/ruxex.git", rev = "851c24d5733c1fb3179d067a087a84d2a6a7c3e4" }
ruxex-app-server-protocol = { version = "0.1.0", git = "https://github.com/Ruxex/ruxex.git", rev = "851c24d5733c1fb3179d067a087a84d2a6a7c3e4" }
ruxex-utils-absolute-path = { version = "0.1.0", git = "https://github.com/Ruxex/ruxex.git", rev = "851c24d5733c1fb3179d067a087a84d2a6a7c3e4" }
ruxex-utils-home-dir = { version = "0.1.0", git = "https://github.com/Ruxex/ruxex.git", rev = "851c24d5733c1fb3179d067a087a84d2a6a7c3e4" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri = { version = "2.8.0", features = [] }
# Keep the proc-macro API aligned with the selected Tauri release.
tauri-macros = "=2.5.5"
# Keep the runtime trait version aligned with tauri-runtime-wry, whose
# dependency is pinned by the selected Tauri release.
tauri-runtime = "=2.10.1"
tauri-plugin-deep-link = "2.4.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.0"
tokio = { version = "1", features = ["macros", "sync"] }

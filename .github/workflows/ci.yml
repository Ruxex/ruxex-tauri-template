name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  artifact-runtime:
    name: Native artifact runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned test Python tools
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: plugins/ruxex-artifacts/tests/pyproject.toml
          enable-cache: true

      - name: Install native renderers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils

      - name: Install native renderers (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask libreoffice
          brew install poppler

      - name: Set up Node.js for runtime assembly
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm for bundled artifact dependencies (macOS)
        if: runner.os == 'macOS'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install locked artifact dependencies (macOS)
        if: runner.os == 'macOS'
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain for artifact executables (macOS)
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Validate runtime assembly and Skill contracts
        run: make artifact-runtime-test

      - name: Assemble and render with target-native tools
        run: |
          python3 scripts/ci_test_native_artifact_runtime.py \
            --output "$RUNNER_TEMP/ruxex-artifact-runtime"

      - name: Build artifact CLI and engine (macOS)
        if: runner.os == 'macOS'
        run: make rust-build-artifact-runtime

      - name: Generate and inspect artifacts with the staged runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 scripts/ci_test_bundled_artifact_runtime.py \
            --node "$(command -v node)" \
            --node-modules node_modules \
            --artifact-sdk artifact-tool \
            --native-runtime "$RUNNER_TEMP/ruxex-artifact-runtime" \
            --artifact-cli target/release/ruxex-artifacts \
            --artifact-engine target/release/ruxex-artifacts-engine

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Resolve Rust dependencies
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml

      - name: Check Rust application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend and staging tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint
        run: pnpm check

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend bundle
        run: pnpm build

      - name: Run runtime staging tests
        run: python3 scripts/test_stage_ruxex_package.py
